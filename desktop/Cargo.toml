[package]
name = "arcadestr-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arcadestr-app = { path = "../app", features = ["native"] }
arcadestr-core = { path = "../core", features = ["native"] }
tauri = { workspace = true }
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.12"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nostr = { version = "0.44" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
rand = "0.10.0"
urlencoding = "2.1"
url = "2"
dirs = "5"
tauri-plugin-keyring = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"
futures-util = "0.3"
base64 = "0.22"
infer = { version = "0.22", default-features = false }
imagesize = { version = "0.15", default-features = false, features = ["jpeg", "png", "webp"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
nostr-sdk = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
