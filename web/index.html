<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcadestr</title>
    <!-- Icon font is bundled (Apache-2.0, assets/fonts/LICENSE-material-symbols):
         no third-party request, and icons still render offline. -->
    <link data-trunk rel="copy-file" href="assets/fonts/material-symbols-outlined.woff2" data-target-path="fonts" />
    <link data-trunk rel="tailwind-css" href="style/tailwind.css" />
    <link data-trunk rel="rust" data-bin="arcadestr-web" data-target-name="arcadestr-web"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
