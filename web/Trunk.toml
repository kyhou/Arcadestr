[serve]
# The port to serve the application on
port = 5173
# WebKit can cache index.html across launches while Trunk replaces hashed WASM.
# Development responses must always come from the current build.
headers = { "Cache-Control" = "no-store" }

[build]
# The index HTML file to use
target = "index.html"

# The output directory for the build
dist = "dist"

# The public URL of the application
public_url = "/"

[watch]
# The UI lives in ../app and its protocol types in ../core; without these,
# `cargo tauri dev` rebuilds the desktop binary but never the frontend.
# Paths are relative to this file. `dist/` is ignored by Trunk itself.
watch = [".", "../app", "../core"]
