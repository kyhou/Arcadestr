[package]
name = "arcadestr-regtest-harness"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
autobenches = false
description = "Explicitly invoked real-Lightning regtest drivers that embed the adp-server reference implementation."

# Deliberately separate: the sibling adp-server repository is cross-implementation
# test infrastructure, never a dependency of Arcadestr's own workspace. Build only
# via `scripts/regtest` or `--manifest-path tests/regtest_harness/Cargo.toml`.
# The tested adp-server revision is pinned in `tests/interop/adp-server.rev`.
[workspace]

[dependencies]
arcadestr-core = { path = "../../core", features = ["native"] }
adp-server = { path = "../../../adp-server/adp-server" }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
bitcoin = "0.32"
futures-util = "0.3"
hex = "0.4"
lightning-invoice = "0.32"
lightning-types = "0.1"
nostr = { version = "0.44", features = ["nip44", "nip46"] }
nostr-sdk = { version = "0.44", features = ["nip57"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.7", features = ["derive"] }
