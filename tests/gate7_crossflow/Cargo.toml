[package]
name = "gate7-crossflow-acceptance"
version = "0.1.0"
edition = "2021"
autotests = false

[[test]]
name = "crossflow"
path = "tests/crossflow.rs"

# Deliberately separate: the sibling reference server is test infrastructure,
# never a dependency of the shipped Arcadestr application.
[workspace]

[dependencies]
arcadestr-core = { path = "../../core", features = ["native"] }
adp-core = { path = "../../../adp-server/adp-core" }
adp-server = { path = "../../../adp-server/adp-server" }
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
bitcoin = "0.32"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
lightning-invoice = "0.32"
nostr-sdk = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
